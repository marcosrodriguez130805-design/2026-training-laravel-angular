<form [formGroup]="form" (ngSubmit)="onSubmit()">
  
  <div class="form-group">
    <ion-item class="ion-margin-bottom">
      <ion-label class="label-stacked">Familia</ion-label>
      <ion-select formControlName="family_uuid" placeholder="Selecciona familia">
        <ion-select-option *ngFor="let family of families" [value]="family.uuid">
          {{ family.name }}
        </ion-select-option>
      </ion-select>
    </ion-item>
  </div>

  <div class="form-group">
    <ion-item class="ion-margin-bottom">
      <ion-label class="label-stacked">Impuesto</ion-label>
      <ion-select formControlName="tax_uuid" placeholder="Selecciona impuesto">
        <ion-select-option *ngFor="let tax of taxes" [value]="tax.uuid">
          {{ tax.name }} ({{ tax.percentage }}%)
        </ion-select-option>
      </ion-select>
    </ion-item>
  </div>

  <div class="form-group">
    <ion-item class="ion-margin-bottom" [class.has-error]="nameControl?.invalid && nameControl?.touched">
      <ion-label class="label-stacked">Nombre</ion-label>
      <ion-input formControlName="name" type="text" placeholder="Nombre del producto"></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="nameControl?.invalid && nameControl?.touched" class="error-text">
      <span *ngIf="nameControl?.errors?.['required']">El nombre es obligatorio.</span>
    </ion-text>
  </div>

  <div class="form-group">
    <ion-item class="ion-margin-bottom">
      <ion-label class="label-stacked">Descripción (opcional)</ion-label>
      <ion-textarea formControlName="description" placeholder="Breve descripción del plato..."></ion-textarea>
    </ion-item>
  </div>

  <div style="display: flex; gap: 12px; margin-bottom: 16px;">
    <div style="flex: 1;" class="form-group">
      <ion-item class="ion-margin-bottom">
        <ion-label class="label-stacked">Precio (€)</ion-label>
        <ion-input formControlName="price" type="number" step="0.01" placeholder="0.00"></ion-input>
      </ion-item>
    </div>

    <div style="flex: 1;" class="form-group">
      <ion-item class="ion-margin-bottom">
        <ion-label class="label-stacked">Stock inicial</ion-label>
        <ion-input formControlName="stock" type="number" placeholder="0"></ion-input>
      </ion-item>
    </div>
  </div>

  <div class="upselling-section">
    <h3>
      <ion-icon name="sparkles-outline"></ion-icon> 
      Estrategia de Venta Inteligente
    </h3>
    
    <div class="form-group">
      <ion-item class="ion-margin-bottom">
        <ion-label class="label-stacked">Producto sugerido</ion-label>
        <ion-select formControlName="suggested_product_uuid" placeholder="Ninguno">
          <ion-select-option [value]="null">Ninguno</ion-select-option>
          <ion-select-option *ngFor="let prod of products" [value]="prod.uuid">
            {{ prod.name }}
          </ion-select-option>
        </ion-select>
      </ion-item>
    </div>

    <div class="form-group">
      <ion-item class="ion-margin-bottom">
        <ion-label class="label-stacked">Guía para el camarero</ion-label>
        <ion-textarea 
          formControlName="upselling_tip" 
          placeholder="Ej: Ofrecer una copa de vino tinto de la casa, combina excelente con la maduración de esta carne."
          rows="2">
        </ion-textarea>
      </ion-item>
    </div>
  </div>

  <div class="form-group">
    <ion-item class="ion-margin-bottom">
      <ion-label>Activo</ion-label>
      <ion-checkbox slot="start" formControlName="active"></ion-checkbox>
    </ion-item>
  </div>

  <div class="form-actions">
    <ion-button fill="clear" class="btn-secondary" (click)="onCancel()">
      Cancelar
    </ion-button>
    <ion-button class="btn-primary" type="submit" [disabled]="form.invalid">
      Guardar Producto
    </ion-button>
  </div>

</form>
