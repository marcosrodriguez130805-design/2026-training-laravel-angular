<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <ion-list lines="none">
    
    <ion-item>
      <ion-label position="stacked">Familia</ion-label>
      <ion-select formControlName="family_uuid" placeholder="Selecciona familia" label-placement="stacked">
        <ion-select-option *ngFor="let family of families" [value]="family.uuid">
          {{ family.name }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
  <ion-label position="stacked">Impuesto</ion-label>
  <ion-select formControlName="tax_uuid" placeholder="Selecciona impuesto">
    <ion-select-option *ngFor="let tax of taxes" [value]="tax.uuid">
      {{ tax.name }} ({{ tax.percentage }}%)
    </ion-select-option>
  </ion-select>
</ion-item>

    <ion-item>
      <ion-label position="stacked">Nombre</ion-label>
      <ion-input formControlName="name" type="text" placeholder="Nombre del producto"></ion-input>
      <ion-text color="danger" *ngIf="nameControl?.invalid && nameControl?.touched">
        <p class="ion-no-margin" style="font-size: 0.8rem;">El nombre es obligatorio.</p>
      </ion-text>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Descripción (opcional)</ion-label>
      <ion-textarea formControlName="description" placeholder="Breve descripción del plato..."></ion-textarea>
    </ion-item>

    <div style="display: flex;">
      <ion-item style="flex: 1;">
        <ion-label position="stacked">Precio (€)</ion-label>
        <ion-input formControlName="price" type="number" step="0.01" placeholder="0.00"></ion-input>
      </ion-item>

      <ion-item style="flex: 1;">
        <ion-label position="stacked">Stock inicial</ion-label>
        <ion-input formControlName="stock" type="number" placeholder="0"></ion-input>
      </ion-item>
    </div>

    <ion-item>
      <ion-checkbox formControlName="active" labelPlacement="end">Activo</ion-checkbox>
    </ion-item>
  </ion-list>

  <div class="ion-padding-top" style="display: flex; gap: 8px;">
    <ion-button expand="block" fill="outline" (click)="onCancel()" style="flex: 1;">
      Cancelar
    </ion-button>
    <ion-button expand="block" type="submit" [disabled]="form.invalid" style="flex: 1;">
      Guardar
    </ion-button>
  </div>
</form>
