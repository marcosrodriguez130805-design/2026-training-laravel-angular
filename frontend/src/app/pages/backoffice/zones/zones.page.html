<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Zonas</ion-title>
    
    <ion-buttons slot="end">
      <ion-button (click)="openCreateModal()">
        <ion-icon slot="icon-only" name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="bg-light">
  <div class="main-content-inner">
    
    <div *ngIf="isLoading" class="ion-text-center ion-padding">
      <ion-spinner name="crescent" color="primary"></ion-spinner>
      <p>Cargando zonas...</p>
    </div>

    <ion-list *ngIf="!isLoading && zones.length > 0" lines="none" class="custom-list">
      <ion-item class="custom-card" *ngFor="let zone of zones" (click)="openEditModal(zone)">
        <ion-icon slot="start" name="map-outline" color="medium"></ion-icon>
        <ion-label [style.opacity]="zone.active ? '1' : '0.5'">
          <h2>{{ zone.name }}</h2>
          <p>Creada {{ zone.created_at | date: 'mediumDate' }}</p>
        </ion-label>

        <ion-buttons slot="end">
          <ion-toggle 
            [checked]="zone.active" 
            (click)="$event.stopPropagation()"
            (ionChange)="toggleActive(zone)">
          </ion-toggle>

          <ion-button color="primary" (click)="openEditModal(zone); $event.stopPropagation()">
            <ion-icon slot="icon-only" name="create"></ion-icon>
          </ion-button>

          <ion-button color="danger" (click)="confirmDelete(zone); $event.stopPropagation()">
            <ion-icon slot="icon-only" name="trash"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-item>
    </ion-list>

    <div *ngIf="!isLoading && zones.length === 0" class="empty-state">
      <ion-icon name="map-outline"></ion-icon>
      <p>No hay zonas registradas todavía.</p>
      <ion-button fill="solid" color="primary" (click)="openCreateModal()">Crear primera zona</ion-button>
    </div>

  </div>

  <ion-modal [isOpen]="isModalOpen" (didDismiss)="closeModal()" [backdropDismiss]="false">
    <ng-template>
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>{{ selectedZone ? 'Editar Zona' : 'Nueva Zona' }}</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="closeModal()">
              <ion-icon slot="icon-only" name="close"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      
      <ion-content class="form-container">
        <app-zone-form
          [zone]="selectedZone"
          [isSaving]="isSaving"
          (save)="onSaveZone($event)"
          (cancel)="closeModal()"
        ></app-zone-form>
      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
