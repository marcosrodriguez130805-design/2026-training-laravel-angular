<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>{{ isModalOpen ? (selectedFamily ? 'Editar Familia' : 'Nueva Familia') : 'Familias' }}</ion-title>
    
    <ion-buttons slot="end">
      <ion-button (click)="isModalOpen ? closeModal() : openCreateModal()">
        <ion-icon slot="icon-only" [name]="isModalOpen ? 'close' : 'add'"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="!isModalOpen">
    <div *ngIf="isLoading" class="ion-text-center ion-padding">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Cargando familias...</p>
    </div>

    <ion-list *ngIf="!isLoading && families.length > 0">
      <ion-item *ngFor="let family of families">
        <ion-label (click)="openEditModal(family)" style="cursor: pointer;" [style.opacity]="family.active ? '1' : '0.5'">
          <h2 style="font-weight: bold;">{{ family.name }}</h2>
          <p>Creado {{ family.created_at | date: 'mediumDate' }}</p>
        </ion-label>

        <ion-buttons slot="end">
          <ion-toggle 
            [checked]="family.active" 
            (ionChange)="toggleActive(family)">
          </ion-toggle>

          <ion-button color="primary" (click)="openEditModal(family)">
            <ion-icon slot="icon-only" name="create"></ion-icon>
          </ion-button>

          <ion-button color="danger" (click)="confirmDelete(family)">
            <ion-icon slot="icon-only" name="trash"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-item>
    </ion-list>

    <div *ngIf="!isLoading && families.length === 0" class="ion-text-center ion-padding">
      <ion-icon name="folder-open-outline" style="font-size: 48px; color: #ccc;"></ion-icon>
      <p>No hay familias registradas todavía.</p>
    </div>
  </div>

  <div *ngIf="isModalOpen" class="ion-padding">
    <app-family-form
      [family]="selectedFamily"
      [isSaving]="isSaving"
      (save)="onSaveFamily($event)"
      (cancel)="closeModal()"
    ></app-family-form>
  </div>
</ion-content>
