<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Impuestos</ion-title>
    
    <ion-buttons slot="end">
      <ion-button (click)="handleCreate()">
        <ion-icon slot="icon-only" name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="bg-light">
  <div class="main-content-inner">

    <div *ngIf="isLoading" class="ion-text-center ion-padding">
      <ion-spinner name="crescent" color="primary"></ion-spinner>
      <p>Cargando impuestos...</p>
    </div>

    <ion-list *ngIf="!isLoading && taxes.length > 0" lines="none" class="custom-list">
      <ion-item class="custom-card" *ngFor="let tax of taxes" (click)="handleEdit(tax)">
        <ion-icon slot="start" name="receipt-outline" color="medium"></ion-icon>
        
        <ion-label>
          <h2>{{ tax.name }}</h2>
          <p>Porcentaje: <strong>{{ tax.percentage }}%</strong></p>
        </ion-label>

        <ion-buttons slot="end">
          <ion-button color="primary" (click)="handleEdit(tax); $event.stopPropagation()">
            <ion-icon slot="icon-only" name="create"></ion-icon>
          </ion-button>
          
          <ion-button color="danger" (click)="handleDelete(tax); $event.stopPropagation()">
            <ion-icon slot="icon-only" name="trash"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-item>
    </ion-list>

    <div *ngIf="!isLoading && taxes.length === 0" class="empty-state">
      <ion-icon name="receipt-outline"></ion-icon>
      <p>No hay impuestos registrados todavía.</p>
      <ion-button fill="solid" color="primary" (click)="handleCreate()">Crear primer impuesto</ion-button>
    </div>

  </div>

  <ion-modal [isOpen]="isCreating" (didDismiss)="cancelForm()" [backdropDismiss]="false">
    <ng-template>
      <ion-header>
        <ion-toolbar color="primary">
          <ion-title>{{ selectedTax ? 'Editar Impuesto' : 'Nuevo Impuesto' }}</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="cancelForm()">
              <ion-icon slot="icon-only" name="close"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      
      <ion-content class="form-container">
        <app-tax-form 
          [tax]="selectedTax"
          (save)="onTaxSaved()"
          (cancel)="cancelForm()">
        </app-tax-form>
      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
